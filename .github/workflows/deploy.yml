name: Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # GitHub environment name (for approvals/secrets), not a secret value
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase Project
        run: supabase link --project-ref iurzpjeubpbcbxhydlud
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Generate Supabase types
        run: supabase gen types typescript --linked > src/utils/database.types.ts
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Verify types were generated
        run: |
          if [ ! -f src/utils/database.types.ts ]; then
            echo "Error: database.types.ts was not generated"
            exit 1
          fi
          echo "Types generated successfully"

      - name: Deploy Database Changes
        run: supabase db push --linked
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Build project
        run: npm run build

      # Add your deployment steps here
      # For example, deploying to Vercel, Netlify, or another platform
      # - name: Deploy to Vercel
      #   run: vercel deploy --prod
      #   env:
      #     VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
