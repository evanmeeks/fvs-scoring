name: Version and Tag Release

on:
  push:
    branches:
      - main

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to push tags
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for commit analysis

      - name: Calculate next semantic version
        id: semver
        uses: PaulHatch/semantic-version@v5.4.0
        with:
          tag_prefix: "v"
          bump_each_commit: false
          version_format: "v${major}.${minor}.${patch}"
          search_commit_body: true

      - name: Configure Git
        if: steps.semver.outputs.version != ''
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and push tag if version changed
        if: steps.semver.outputs.version != ''
        run: |
          git tag -a "${{ steps.semver.outputs.version }}" -m "Release ${{ steps.semver.outputs.version }}"
          git push origin "${{ steps.semver.outputs.version }}"

      - name: Create GitHub Release (optional but recommended)
        if: steps.semver.outputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.semver.outputs.version }}
          name: Release ${{ steps.semver.outputs.version }}
          body: |
            Automated release based on commits since last tag.
            - ${{ steps.semver.outputs.version_type }} bump
            Full changelog: ${{ github.server_url }}/${{ github.repository }}/compare/${{ steps.semver.outputs.previous_tag }}...${{ steps.semver.outputs.version }}
          draft: false
          prerelease: ${{ steps.semver.outputs.prerelease }}