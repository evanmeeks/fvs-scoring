[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

  # Configure external modules for esbuild
  external_node_modules = ["@vercel/og"]

# Edge Functions configuration
[[edge_functions]]
  function = "social-meta"
  path = "/global-consensus/*"

[[edge_functions]]
  function = "social-meta"
  path = "/audit-target/*"

# Configure the dev server for Netlify Preview Servers
[dev]
  command = "npm run dev"
  port = 8888
  targetPort = 5173
  framework = "#custom"
  autoLaunch = false

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
